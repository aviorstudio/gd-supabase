name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version=0.0.1
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) exit 1 ;;
            esac
            version="$major.$minor.$patch"
          fi
          tag="v$version"
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
          test "$plugin_version" = "$version" || { echo "plugin.cfg is $plugin_version; expected $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Test exact release commit and package bytes
        uses: ./.github/actions/test
      - name: Record tested artifact identity
        run: (cd dist && sha256sum @aviorstudio_gd-supabase.zip > @aviorstudio_gd-supabase.zip.sha256)
      - name: Preserve tested bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: |
            dist/@aviorstudio_gd-supabase.zip
            dist/@aviorstudio_gd-supabase.zip.sha256
            dist/installed-tree.sha256
            dist/web-evidence.png
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Recover tested bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: dist
      - name: Verify tested bytes
        run: (cd dist && sha256sum --check @aviorstudio_gd-supabase.zip.sha256)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" dist/@aviorstudio_gd-supabase.zip dist/@aviorstudio_gd-supabase.zip.sha256 dist/installed-tree.sha256 dist/web-evidence.png --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG from exact tested bytes"
      - name: Install GDAM
        uses: aviorstudio/gdam-actions/install@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          version: v0.0.8
      - name: Verify pinned GDAM executable
        run: |
          set -euo pipefail
          printf '%s  %s\n' bf5d03baa94da905ca128a55c4acd6b0552c60127d53fc4d01ecaa8a377b0b53 "$(command -v gdam)" | sha256sum --check
          gdam --version
      - name: Publish to GDAM
        uses: aviorstudio/gdam-actions/publish@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          asset: "@aviorstudio_gd-supabase.zip"
          tag: ${{ needs.prepare.outputs.tag }}
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
