name: Setup Godot
description: Install checksummed Godot and optional export templates
inputs:
  godot-version:
    description: Godot version to install
    required: true
  godot-sha256:
    description: SHA-256 of the Linux editor archive
    required: true
  templates-sha256:
    description: SHA-256 of the export templates archive
    required: false
    default: ''
  install-templates:
    description: Whether to install export templates
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache immutable Godot downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/godot-downloads
        key: godot-downloads-${{ inputs.godot-version }}-${{ inputs.godot-sha256 }}-${{ inputs.templates-sha256 }}

    - name: Install verified Godot editor
      shell: bash
      run: |
        set -euo pipefail
        downloads="${{ runner.temp }}/godot-downloads"
        archive="$downloads/Godot_v${{ inputs.godot-version }}-stable_linux.x86_64.zip"
        mkdir -p "$downloads" "${{ runner.temp }}/godot-editor"
        if [ ! -f "$archive" ]; then
          wget -q -O "$archive" "https://github.com/godotengine/godot/releases/download/${{ inputs.godot-version }}-stable/Godot_v${{ inputs.godot-version }}-stable_linux.x86_64.zip"
        fi
        echo "${{ inputs.godot-sha256 }}  $archive" | sha256sum --check --strict
        unzip -q -o "$archive" -d "${{ runner.temp }}/godot-editor"
        sudo install -m 0755 "${{ runner.temp }}/godot-editor/Godot_v${{ inputs.godot-version }}-stable_linux.x86_64" /usr/local/bin/godot
        godot --version | grep -F "${{ inputs.godot-version }}.stable"

    - name: Install verified export templates
      if: inputs.install-templates == 'true'
      shell: bash
      run: |
        set -euo pipefail
        test -n "${{ inputs.templates-sha256 }}"
        downloads="${{ runner.temp }}/godot-downloads"
        archive="$downloads/Godot_v${{ inputs.godot-version }}-stable_export_templates.tpz"
        destination="$HOME/.local/share/godot/export_templates/${{ inputs.godot-version }}.stable"
        if [ ! -f "$archive" ]; then
          wget -q -O "$archive" "https://github.com/godotengine/godot/releases/download/${{ inputs.godot-version }}-stable/Godot_v${{ inputs.godot-version }}-stable_export_templates.tpz"
        fi
        echo "${{ inputs.templates-sha256 }}  $archive" | sha256sum --check --strict
        rm -rf "${{ runner.temp }}/godot-templates"
        mkdir -p "${{ runner.temp }}/godot-templates" "$destination"
        unzip -q "$archive" -d "${{ runner.temp }}/godot-templates"
        cp -R "${{ runner.temp }}/godot-templates/templates/." "$destination/"
        test -s "$destination/web_nothreads_release.zip"
