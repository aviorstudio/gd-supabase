name: Setup Godot
description: Install caller-pinned engine and templates through released shared setup
inputs:
  godot-version:
    description: Godot version to install
    required: true
  godot-sha256:
    description: SHA-256 of the Linux editor archive
    required: true
  templates-sha256:
    description: SHA-256 of the export templates archive
    required: false
    default: ''
  install-templates:
    description: Whether to install export templates
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - uses: nicodes/tools/helpers@f412061a7a3f0914db9e09d1159e69504aee8706
  - name: Install checksum-verified engine and templates
    shell: bash
    env:
      GODOT_VERSION: ${{ inputs.godot-version }}
      GODOT_BINARY_SHA: ${{ inputs.godot-sha256 }}
      GODOT_TEMPLATES_SHA: ${{ inputs.templates-sha256 }}
      GODOT_TEMPLATES: ${{ inputs.install-templates }}
    run: |
      set -euo pipefail
      args=(--version "$GODOT_VERSION" --origin godot --binary-checksum "sha256:$GODOT_BINARY_SHA" --root "$RUNNER_TEMP/godot-verified")
      if [ "$GODOT_TEMPLATES" = true ]; then
        args+=(--templates --templates-checksum "sha256:$GODOT_TEMPLATES_SHA")
      fi
      python3 "$TOOLS_ROOT/helpers/godot-setup.py" "${args[@]}"
  - name: Verify required web template
    if: inputs.install-templates == 'true'
    shell: bash
    env:
      GODOT_VERSION: ${{ inputs.godot-version }}
    run: test -s "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/web_nothreads_release.zip"
